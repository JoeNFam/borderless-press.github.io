<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borderless Press - Global News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <!-- Header -->
    <header class="bg-red-600 text-white py-4">
        <div class="container mx-auto px-4">
            <h1 class="text-4xl font-bold">Borderless Press</h1>
            <p class="text-lg">Your Source for Global News</p>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-gray-800 text-white py-2">
        <div class="container mx-auto px-4">
            <ul class="flex space-x-6">
                <li><a href="#" class="hover:text-red-400">Home</a></li>
                <li><a href="#" class="hover:text-red-400">World</a></li>
                <li><a href="#" class="hover:text-red-400">Politics</a></li>
                <li><a href="#" class="hover:text-red-400">Business</a></li>
                <li><a href="#" class="hover:text-red-400">Technology</a></li>
                <li><a href="#" class="hover:text-red-400">Health</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row gap-8">
            <!-- Featured News -->
            <section class="md:w-2/3">
                <h2 class="text-2xl font-bold mb-4">Top Stories</h2>
                <div id="featured-news" class="space-y-6">
                    <!-- Articles will be dynamically inserted here -->
                </div>
            </section>

            <!-- Sidebar -->
            <aside class="md:w-1/3">
                <h2 class="text-xl font-bold mb-4">Latest Updates</h2>
                <div id="latest-news" class="space-y-4">
                    <!-- Latest news will be dynamically inserted here -->
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-4">
        <div class="container mx-auto px-4">
            <p>&copy; 2025 Borderless Press. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
